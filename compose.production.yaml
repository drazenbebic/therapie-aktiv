# Therapie Aktiv Register — LAN-only deployment.
#
# First start:
#   mkdir -p data
#   cp .env.production.example .env.production          # then set APP_KEY and APP_URL
#   docker compose -f compose.production.yaml up -d --build
#   docker compose -f compose.production.yaml exec app php artisan make:filament-user
#
# The database lives in ./data/database.sqlite. Daily consistent copies go to ./data/backups
# (see the backup service below); back up ./data/backups, not the live database file.

name: therapie-aktiv-prod

services:
  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: therapie-aktiv:latest
    container_name: therapie-aktiv
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "8080:8080"
    volumes:
      - ./data:/srv/data
    security_opt:
      - no-new-privileges:true

  backup:
    image: therapie-aktiv:latest
    pull_policy: never
    container_name: therapie-aktiv-backup
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./data:/srv/data
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c"]
    # Every 24 hours: write a consistent copy and keep the newest 30.
    command:
      - |
        while true; do
          php artisan app:backup-database --keep=30 || echo "Backup failed" >&2
          sleep 86400
        done
    healthcheck:
      disable: true
