# Local development with Laravel Sail (`./vendor/bin/sail up -d`).
# Ports are chosen so this runs next to the easynext Sail stack (80, 5173, 3306, 8080, …).
# Production on the NUC uses compose.production.yaml instead.
name: therapie-aktiv

services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'therapie-aktiv-sail/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8100}:80'
            - '${VITE_PORT:-5183}:${VITE_PORT:-5183}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
networks:
    sail:
        driver: bridge
